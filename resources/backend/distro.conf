# Distro policy for the installed system. See distro_config.sh for the keys. A file at
# /etc/voyage/distro.conf in the live image replaces this one entirely.
#
# The installer asks for a login shell for the first user and for root. /bin/sh stays dash on every
# choice: nothing here touches it.

# shell <name> <absolute path> [package installed from the network when the live image lacks it]
shell bash /bin/bash
shell zsh  /usr/bin/zsh zsh
shell fish /usr/bin/fish fish-shell
# what both accounts get unless the user picks another
default-shell bash

# Packages that only make sense on the live image; removed from the new system.
remove voyage xmirror dialog xtools-minimal cryptsetup

# Installed automatically when hardware drivers are enabled on a VirtualBox guest.
# virtualbox-ose-guest does not depend on its kernel modules; without the dkms package (which pulls dkms and
# linux-headers) the in-tree driver, which reports 6.0.0, is used and guest control breaks.
vbox-guest-install virtualbox-ose-guest-dkms virtualbox-ose-guest
vbox-guest-enable vboxservice

# Desktops. The copy brings the live image's desktop along: the first desktop below whose first package the
# live image has. An online install can put another one in its place (or next to it); any install can leave
# the desktop out.
# desktop <name> <session> <login manager> <label...>
desktop xfce        xfce            lightdm         Xfce
desktop gnome       gnome           gdm             GNOME (voidlab)
desktop gnome-void  gnome           gdm             GNOME (stock Void)
desktop cinnamon    cinnamon        lightdm         Cinnamon
desktop cosmic      cosmic          cosmic-greeter  COSMIC
desktop kde         plasma          sddm            KDE Plasma
desktop lxqt        lxqt            sddm            LXQt
desktop budgie      budgie-desktop  lightdm         Budgie
# What installs a desktop (and what removing it takes out). The first package tells whether a system has it.
desktop-packages xfce        xfce4-session xfce-core xfce4-whiskermenu-plugin xfce4-pulseaudio-plugin network-manager-applet xorg-minimal xorg-fonts
desktop-packages gnome       gnome-shell gnome-core gnome-session gnome-settings-daemon gnome-control-center gnome-keyring gnome-backgrounds nautilus gnome-disk-utility xdg-desktop-portal-gnome
desktop-packages gnome-void  gnome-shell gnome-core
desktop-packages cinnamon    cinnamon network-manager-applet xorg-minimal xorg-fonts
desktop-packages cosmic      cosmic-session cosmic-desktop
desktop-packages kde         plasma-workspace kde-plasma
desktop-packages lxqt        lxqt-session lxqt network-manager-applet xorg-minimal xorg-fonts
desktop-packages budgie      budgie-desktop network-manager-applet xorg-minimal xorg-fonts
# Installed from Void's own repositories only, and kept there on updates (xbps repolock).
desktop-official gnome-void
# Offered only when the live image's xbps.d configures a repository whose URL contains this word: voidlab
# builds these (Void has no COSMIC, and its GNOME is the stock one). The installer adds no repository or key.
desktop-repository gnome   voidlab
desktop-repository cosmic  voidlab

# Login managers: <name> is also its service. The installer enables the chosen one and switches the others off.
# login-manager <name> <package>...
login-manager lightdm         lightdm lightdm-gtk3-greeter xorg-minimal
login-manager gdm             gdm
login-manager sddm            sddm xorg-minimal
login-manager cosmic-greeter  cosmic-greeter
# when a login manager needs more services than its own, in start order
login-manager-services cosmic-greeter cosmic-greeter-daemon cosmic-greeter
# offered only when the new system has one of these desktops
login-manager-needs gdm gnome gnome-void
login-manager-needs cosmic-greeter cosmic

# Also removed for an install without a desktop: the live image's graphical applications.
headless-remove firefox gparted alacritty labwc xset xrandr adw-gtk3 nerd-fonts-cascadiacode caerus pilot mesa-dri xorg-minimal xorg-fonts

# More packages for the new system (online installs only), and services to switch on or off:
#install nano
#enable sshd
#disable dhcpcd
